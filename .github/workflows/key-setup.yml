name: key-setup (GECICI)

# TEK SEFERLİK. Üretim Ed25519 anahtarını GitHub runner'ında üretir ve özel
# anahtarı doğrudan repository Actions secret'ına yazar. Özel anahtar hiçbir
# log, çıktı, artifact, dosya veya commit'e girmez. Anahtar kurulduktan sonra
# bu dosya repodan KALDIRILIR (bkz. KEY_ROTATION.md).
#
# Gerekli geçici secret: KEY_SETUP_TOKEN — fine-grained PAT, yalnız bu repo,
# yalnız "Secrets: Read and write", 1 gün geçerli.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash  # -eo pipefail; xtrace KAPALI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install -r requirements.txt

      - name: KEY_SETUP_TOKEN var mi
        env:
          KEY_SETUP_TOKEN: ${{ secrets.KEY_SETUP_TOKEN }}
        run: |
          if [ -z "${KEY_SETUP_TOKEN}" ]; then echo "KEY_SETUP_TOKEN secret'ı yok; çalıştırılmadı."; exit 1; fi
          echo "KEY_SETUP_TOKEN mevcut."

      - name: Uretim anahtari zaten var mi (uzerine yazma yok)
        env:
          GH_TOKEN: ${{ secrets.KEY_SETUP_TOKEN }}
        run: |
          names="$(gh secret list --repo "$GITHUB_REPOSITORY" --json name -q '.[].name')"
          if printf '%s\n' "$names" | grep -qx BLOCKLIST_ED25519_PRIVATE_KEY_B64; then
            echo "BLOCKLIST_ED25519_PRIVATE_KEY_B64 zaten var; üzerine yazılmaz."; exit 1
          fi

      - name: Anahtar uret ve dogrudan secret'a yaz (stdin)
        env:
          GH_TOKEN: ${{ secrets.KEY_SETUP_TOKEN }}
        run: |
          set +x
          umask 077
          # Özel anahtar yalnız boru içinde (stdout → gh stdin) yaşar.
          python -m src.signing keygen public_key.b64 \
            | gh secret set BLOCKLIST_ED25519_PRIVATE_KEY_B64 --repo "$GITHUB_REPOSITORY" --app actions

      - name: Secret adini dogrula (deger okunmaz)
        env:
          GH_TOKEN: ${{ secrets.KEY_SETUP_TOKEN }}
        run: |
          gh secret list --repo "$GITHUB_REPOSITORY" --json name -q '.[].name' \
            | grep -qx BLOCKLIST_ED25519_PRIVATE_KEY_B64
          echo "BLOCKLIST_ED25519_PRIVATE_KEY_B64 oluşturuldu."

      - name: Genel anahtar parmak izi
        run: |
          python - <<'EOF'
          from pathlib import Path
          from src.signing import fingerprint, public_key_from_b64
          fp = fingerprint(public_key_from_b64(Path("public_key.b64").read_text()))
          Path("public_key.fingerprint").write_text(fp + "\n")
          print(f"Genel anahtar: {Path('public_key.b64').read_text().strip()}")
          print(f"Parmak izi (SHA-256): {fp}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: public-key
          path: |
            public_key.b64
            public_key.fingerprint
          if-no-files-found: error

      - name: Gecici KEY_SETUP_TOKEN secret'ini sil
        env:
          GH_TOKEN: ${{ secrets.KEY_SETUP_TOKEN }}
        run: |
          gh secret delete KEY_SETUP_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "KEY_SETUP_TOKEN silindi. Kalan secret adları:"
          gh secret list --repo "$GITHUB_REPOSITORY" --json name -q '.[].name'
